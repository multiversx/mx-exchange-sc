name: Release

on:
  workflow_dispatch:
    inputs:
      contract_name:
        description: Run from the release tag. Contract to build (e.g. token-unstake); empty = all contracts.
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    uses: multiversx/mx-sc-actions/.github/workflows/reproducible-build.yml@ad3c3fdf74c85e678c2c7b065a981f1bef70e95c
    with:
      image_tag: v12.0.0
      contract_name: ${{ inputs.contract_name }}
      attach_to_existing_release: true
