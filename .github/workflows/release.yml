name: Release

on:
  workflow_dispatch:
    inputs:
      contract_name:
        description: Run from the release tag. Contracts to build, separated by commas (e.g. pair,router); empty = all contracts.
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    uses: multiversx/mx-sc-actions/.github/workflows/reproducible-build.yml@042585813397715819af7c1c6aaaa6a8e576521b
    with:
      image_tag: v12.0.0
      contract_name: ${{ inputs.contract_name }}
      attach_to_existing_release: true
